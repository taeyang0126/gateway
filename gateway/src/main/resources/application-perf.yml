gateway:
  # 需求 10：覆盖连接池，生产配置 max-connections-per-host=1 不足以触发 borrow/requite 竞争
  connection-pool:
    max-connections-per-host: 20
    acquire-timeout-millis: 600

  # perf 配置下路由规模大，预热预算与连接预热强度需要显式放宽
  health:
    warmup-timeout-seconds: 45
    warmup-internal-max-total-iterations: 120000
    warmup-internal-min-iterations-per-route: 1000
    warmup-upstream-acquire-count: 4

  routes:
    # 基础业务路由：供 BaseProxy/JWT/Delay/FileTransfer 等场景使用
    - id: example-service
      path-prefix: /api/example/**
      upstream: http://localhost:8082

    # JWT 业务路由：与默认配置保持一致
    - id: example-service-jwt
      path-prefix: /api/example/private/**
      upstream: http://localhost:8082
      security:
        enabled: true
        auth:
          enabled: true
          type: JWT
          providers:
            jwt:
              issuer: example-issuer
              audience: example-audience
              # 与 auth-jwt-example 的 auth.jwt.public-key 保持一致。
              public-key: |
                -----BEGIN PUBLIC KEY-----
                MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA6I25MXjpwwaXaDp0ilnr
                5GQr/XioqlIJFjx9MMCD2Dk9T+SM1gNzRfoptZl13fQvImErCkdK9/CEEP9R2L0x
                PwYdoZq6yoNQlwYg/cFh/VyVQB1t8+KDkUfrUlfGTZHErFpvpwMLtQ7c1aJECChD
                gWAC0yF0PRIvfuEDEOFwWJXpumlUYMIEMSA5Li2o1SAxznFY88mtMcnJo4EzKYcT
                6kA7MZVwXwI9EpCr+2XXiN/8NUMwNJUjYPhG34pYESqJ+5giZofggxD/+TquqakR
                VpBK5pvbnDSZ55yix/zgG83es4AyGY3mje/8B4mnayJf3FsoOg/WOiYupl+jNSC7
                LwIDAQAB
                -----END PUBLIC KEY-----

    # 需求 3：限流测试专用路由（独立路径 /api/perf/hello，不覆盖业务路由）
    - id: perf-rate-limit-test
      path-prefix: /api/perf/hello
      upstream: http://localhost:8082
      rewrite-path: "^/api/perf/hello(.*)"
      rewrite-replacement: "/api/example/hello$1"
      security:
        enabled: true
        rate-limit:
          ip:
            enabled: true
            permits-per-second: 100

    # 需求 13：慢上游超时测试路由（timeout-seconds=1，上游 500ms 慢接口触发 504）
    - id: perf-slow-timeout
      path-prefix: /api/perf/slow
      upstream: http://localhost:8082
      timeout-seconds: 1
      rewrite-path: "^/api/perf/slow(.*)"
      rewrite-replacement: "/api/example/delay/slow$1"

    # 需求 13：不可达上游路由（用于 502 测试）
    - id: perf-unreachable
      path-prefix: /api/perf/unreachable
      upstream: http://localhost:19999

    # 需求 14：路由规则数量性能对比 — 1 条基准路由
    - id: perf-route-1
      path-prefix: /api/perf/route1/**
      upstream: http://localhost:8082
      rewrite-path: "^/api/perf/route1(.*)"
      rewrite-replacement: "/api/example$1"

    # 需求 14：路由规则数量性能对比 — 10 条路由（perf-route-2 ~ perf-route-10）
