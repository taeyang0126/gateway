name: Quality Gate

on:
  push:
    branches:
      - main
      - rewrite/**
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Detect Java Sources
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -path "*/src/main/java/*.java" -o -path "*/src/test/java/*.java" \) | grep -q .; then
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Quality Gate
        run: ./mvnw -B -ntp -Pquality -Dquality.bootstrap=${{ steps.detect.outputs.bootstrap }} verify
