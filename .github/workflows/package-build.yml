name: Package Build

on:
  push:
    branches:
      - main
      - rewrite/**
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: maven

      - name: Package
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload Gateway Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-server-jar
          path: gateway-server/target/*.jar
          if-no-files-found: error
          retention-days: 14
