name: Visual Board Sync

on:
  push:
    branches:
      - main
      - rewrite/**
      - feature/**
  pull_request:
  workflow_dispatch:

jobs:
  visual-board-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Visual Board Sync
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          else
            base_sha="$(git rev-list --max-parents=0 HEAD)"
            head_sha="${{ github.sha }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${head_sha}" || true)"
          echo "Changed files between ${base_sha}..${head_sha}:"
          echo "${changed_files}"

          if [[ -z "${changed_files}" ]]; then
            echo "No changed files detected, skip."
            exit 0
          fi

          requires_board_sync=false
          if echo "${changed_files}" | grep -Eq \
            '^(docs/requirements/|docs/design/|gateway-[^/]+/src/|scripts/perf/)'; then
            requires_board_sync=true
          fi

          dev_board_updated=false
          if echo "${changed_files}" | grep -Eq \
            '^docs/learning/stage[^/]+/06-.*\.html$'; then
            dev_board_updated=true
          fi

          learning_board_updated=false
          if echo "${changed_files}" | grep -Eq \
            '^docs/learning/stage[^/]+/07-.*\.html$'; then
            learning_board_updated=true
          fi

          if [[ "${requires_board_sync}" == "true" && "${dev_board_updated}" != "true" ]]; then
            echo "[FAIL] 检测到需求/设计/实现相关变更，但未同步开发流程看板。"
            echo "请至少更新一个文件：docs/learning/stageX/06-*.html"
            exit 1
          fi

          if [[ "${requires_board_sync}" == "true" && "${learning_board_updated}" != "true" ]]; then
            echo "[FAIL] 检测到需求/设计/实现相关变更，但未同步学习指导看板。"
            echo "请至少更新一个文件：docs/learning/stageX/07-*.html"
            exit 1
          fi

          if ! grep -Eq \
            '\[[^]]*可视化[^]]*\]\(docs/learning/stage1/06-阶段1开发流程可视化\.html\)' README.md; then
            echo "[FAIL] README.md 缺少可点击的阶段1可视化看板链接。"
            exit 1
          fi

          if ! grep -Eq \
            '\[[^]]*学习[^]]*看板[^]]*\]\(docs/learning/stage1/07-阶段1学习指导看板\.html\)' README.md; then
            echo "[FAIL] README.md 缺少可点击的阶段1学习指导看板链接。"
            exit 1
          fi

          echo "[PASS] 开发流程看板与学习指导看板同步校验通过。"
