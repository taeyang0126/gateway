info:
  name: token-verify-invalid
  type: http
  seq: 3

http:
  method: POST
  url: "{{auth-jwt-host}}/api/auth-jwt/verify"
  auth: inherit
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "not-a-jwt"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
